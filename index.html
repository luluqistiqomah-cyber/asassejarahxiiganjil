<style>

.res{max-width:560px;width:100%;padding:32px;text-align:center}

.pill{padding:3px 10px;border-radius:999px;font-size:.74rem;font-weight:700}.pill.t{background:var(--green-bg);color:var(--green)}.pill.b{background:#fff1e6;color:#c2410c}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.kpi b{font-size:1.7rem;display:block}.kpi span{font-size:.78rem;color:var(--mut)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:200;box-shadow:var(--shadow);font-weight:600;animation:fade .3s}

<body>
<div id="app"></div>
<script>
"use strict";
const QB=[{"q": "Perang Dunia I dipicu oleh penembakan Putra Mahkota Austria-Hongaria, Franz Ferdinand, di Sarajevo pada tahun 1914. Namun, insiden regional ini dengan cepat berubah menjadi perang global yang melibatkan negara-negara besar di Eropa. Faktor utama yang menyebabkan eskalasi konflik lokal tersebut menjadi perang berskala internasional yang masif adalah...", "o": ["Ambisi Serbia untuk menguasai seluruh wilayah Semenanjung Balkan dengan dukungan finansial penuh dari militer Inggris.", "Sistem aliansi militer pertahanan yang memaksa negara-negara Eropa saling terlibat secara otomatis ketika sekutu mereka diserang.", "Keinginan Amerika Serikat untuk segera berekspansi dan ikut campur dalam urusan politik internal kerajaan-kerajaan di Eropa.", "Runtuhnya kekuatan ekonomi Kesultanan Utsmaniyah yang memicu perebutan kekuasaan secara langsung di benua Amerika.", "Kegagalan organisasi Liga Bangsa-Bangsa dalam menengahi perselisihan tapal batas antara kekaisaran Austria dan Serbia."]}, {"q": "Perhatikan data perkiraan mobilisasi dan korban militer pada Perang Dunia I berikut: Rusia memobilisasi 12.000.000 pasukan dengan 9.150.000 korban (mati, luka, hilang); Jerman memobilisasi 11.000.000 pasukan dengan 7.142.000 korban; Prancis memobilisasi 8.410.000 pasukan dengan 6.160.000 korban; dan Inggris memobilisasi 8.904.000 pasukan dengan 3.190.000 korban. Berdasarkan perhitungan data statistik militer tersebut, simpulan numerik yang paling akurat adalah...", "o": ["Inggris mengalami tingkat persentase kerugian pasukan tertinggi dibandingkan dengan negara-negara blok Sekutu lainnya.", "Jerman memiliki sisa pasukan selamat yang jauh lebih sedikit dibandingkan dengan sisa pasukan Rusia di akhir perang.", "Prancis mencatat sejarah tragis karena lebih dari separuh pasukan yang dimobilisasinya menjadi korban pertempuran.", "Rusia dan Jerman memiliki tingkat persentase korban yang sama persis bila dihitung dari total pasukan yang dimobilisasi.", "Seluruh negara yang terlibat konflik utama kehilangan lebih dari delapan puluh persen dari total angkatan bersenjatanya."]}, {"q": "Selama Perang Dunia I, pertempuran di Front Barat didominasi oleh strategi perang parit (trench warfare) yang membentang dari pantai Belgia hingga perbatasan Swiss. Jutaan prajurit hidup dalam parit yang penuh lumpur, wabah penyakit, dan intaian artileri. Jarak antar parit musuh seringkali hanya belasan meter, namun garis depan nyaris tidak bergeser selama bertahun-tahun. Evaluasilah efektivitas strategi perang parit tersebut terhadap pencapaian tujuan militer dan politik negara-negara yang berkonflik.", "o": ["Strategi ini terbukti sangat efektif karena berhasil meminimalkan jumlah korban jiwa akibat serangan senjata kimia beracun.", "Strategi ini efektif dalam mempercepat pergerakan infanteri penyerang untuk menembus garis pertahanan berlapis milik musuh.", "Strategi ini gagal mencapai tujuan militer secara cepat karena menciptakan kebuntuan operasional (stalemate) yang memperpanjang perang.", "Strategi ini memberikan keuntungan telak bagi pihak penyerang karena mudah disokong oleh dukungan pesawat tempur konvensional.", "Strategi ini secara tidak langsung mempermudah diplomasi karena kedua belah pihak merasa nyaman hidup di dalam garis pertahanan."]}, {"q": "Perang Dunia I merupakan contoh nyata penerapan konsep “Perang Total” (Total War). Dalam sistem ini, negara-negara yang terlibat mengalihkan seluruh sumber daya ekonomi, kapasitas industri, dan tenaga kerja sipil murni untuk memenangkan peperangan. Pabrik kebutuhan sipil diubah menjadi pabrik amunisi secara paksa. Analisislah dampak sosial jangka panjang paling masif dari kebijakan perang total tersebut terhadap struktur demografi masyarakat di Eropa kala itu.", "o": ["Terjadinya eksodus atau perpindahan penduduk secara besar-besaran dari kawasan perkotaan menuju pedesaan.", "Meningkatnya peran dan emansipasi perempuan dalam sektor industri berat publik guna menggantikan pekerja laki-laki.", "Menurunnya kuantitas produksi senjata karena warga sipil secara serentak menolak bekerja sama dengan pemerintah militer.", "Terhapusnya sistem kelas sosial dalam masyarakat hierarkis Eropa akibat sentralisasi kebijakan pembagian bahan makanan.", "Munculnya kembali corak sistem ekonomi agraris feodal akibat hancurnya infrastruktur industri modern di wilayah Eropa Barat."]}, {"q": "Setelah Perang Dunia I usai, Perjanjian Versailles dirumuskan pada 1919 oleh pihak Sekutu untuk mendikte Jerman. Melalui perjanjian tersebut, Jerman dipaksa menyerahkan 13% wilayah teritorialnya, membatasi pasukan militernya maksimal 100.000 personel tanpa angkatan udara, serta menanggung pampasan perang yang amat besar. Menilai dari substansi kesepakatan tersebut, mengapa Perjanjian Versailles justru dievaluasi oleh para ahli sejarah sebagai instrumen kegagalan perdamaian?", "o": ["Klausul perjanjian terlalu longgar sehingga memberi celah bagi Jerman untuk memulihkan aliansi militer lamanya dengan cepat.", "Keputusan tersebut menciptakan beban kebangkrutan ekonomi dan sentimen penghinaan nasional yang melahirkan radikalisme di Jerman.", "Perjanjian Versailles secara langsung mewajibkan pihak Sekutu untuk mengembalikan seluruh tanah jajahan Jerman di benua Afrika.", "Regulasi yang kaku membuat Amerika Serikat mengisolasi diri dan menarik semua bantuan kemanusiaan dari wilayah Eropa Timur.", "Pembatasan personel militer hanya diberlakukan pada angkatan laut tanpa menyentuh esensi kekuatan pasukan darat Kekaisaran Jerman."]}, {"q": "Pada tahun 1921, pihak Sekutu menetapkan Jerman harus membayar pampasan perang sebesar 132 miliar Mark Emas. Akibat lumpuhnya industri pascaperang, Republik Weimar tidak memiliki cadangan emas yang cukup sehingga memutuskan untuk terus mencetak uang kertas. Data historis mencatat: pada tahun 1914 nilai tukar 1 Dolar AS setara dengan 4,2 Mark Jerman, namun pada November 1923 nilai tersebut anjlok menjadi 1 Dolar AS setara dengan 4,2 triliun Mark. Kesimpulan logis mengenai dampak kebijakan moneter Jerman berdasarkan angka tersebut adalah...", "o": ["Jerman menderita hiperinflasi ekstrem yang menghancurkan seluruh nilai tabungan dan daya beli masyarakat umum.", "Perekonomian Jerman mencatatkan pertumbuhan industri yang pesat akibat peredaran uang domestik yang sangat berlimpah.", "Nilai utang pokok pampasan perang kepada negara Sekutu berhasil dilunasi seketika berkat jatuhnya kurs dolar Amerika.", "Kepercayaan masyarakat internasional terhadap Jerman pulih karena mereka mampu membiayai operasional kenegaraannya.", "Pemerintah Jerman sukses menstabilkan harga kebutuhan pangan lokal kendati nilai tukar mata uang resminya fluktuatif."]}, {"q": "Berakhirnya Perang Dunia I tidak hanya sekadar mengubah peta perbatasan negara, melainkan juga meruntuhkan secara tragis empat dinasti monarki besar: Romanov di Rusia, Hohenzollern di Jerman, Habsburg di Austria-Hongaria, dan Kesultanan Utsmaniyah. Runtuhnya kekaisaran multietnis tersebut lantas melahirkan negara-negara nasional baru. Analisislah keterkaitan struktural antara kejatuhan kekaisaran tersebut dengan kebangkitan geopolitik baru di awal abad ke-20.", "o": ["Negara-negara baru sengaja dirancang secara damai oleh dinasti yang runtuh untuk menyelamatkan sebagian kecil aset kerajaannya.", "Hilangnya kontrol otoriter monarki memberi ruang bagi semangat nasionalisme dan penentuan nasib sendiri (self-determination) untuk merdeka.", "Terdapat kesepakatan rahasia antara dinasti Romanov dan Utsmaniyah untuk mentransfer kekuasaan mereka kepada Amerika Serikat.", "Masyarakat dunia mendesak Liga Bangsa-Bangsa agar bekas wilayah kerajaan tersebut dibiarkan menjadi daerah tak bertuan secara permanen.", "Kebijakan internasional secara paksa mendirikan bentuk negara monarki absolut yang jauh lebih radikal di kawasan Timur Tengah."]}, {"q": "Liga Bangsa-Bangsa (LBB) diinisiasi pasca-Perang Dunia I dengan cita-cita mulia mencegah terulangnya perang global melalui instrumen diplomasi, negosiasi damai, dan perlucutan senjata. Faktanya, LBB gagal menghentikan agresi militer di dekade berikutnya karena mereka hanya mengandalkan sanksi ekonomi dan kutukan moral tanpa didukung mekanisme penegakan hukum yang mengikat. Jika Anda diminta untuk mendesain ulang klausul pakta LBB agar relevan dan efektif mencegah agresi bersenjata, instrumen utama yang harus ditambahkan adalah...", "o": ["Penghapusan hak prerogatif diplomasi kenegaraan sehingga kebijakan internasional ditentukan sepenuhnya oleh organisasi nirlaba.", "Pembentukan pasukan perdamaian gabungan yang independen dan memiliki kekuatan legal operasional untuk menindak negara agresor.", "Pemaksaan terhadap setiap negara anggota agar memusnahkan seluruh angkatan bersenjatanya dalam waktu kurang dari satu tahun.", "Pengalihan tujuan sentral organisasi semata-mata pada pengelolaan perdagangan lintas benua ketimbang mengurusi sengketa wilayah.", "Pengembalian seluruh manajemen diplomasi global kepada sistem perjanjian rahasia (secret diplomacy) di antara negara-negara elit."]}, {"q": "Medan pertempuran Perang Dunia I menjadi saksi uji coba berbagai teknologi militer modern pembawa maut, salah satunya adalah gas beracun klorin di Pertempuran Ypres Kedua (1915). Walaupun di fase awal berhasil menciptakan kepanikan massal dan merobek garis depan musuh, efektivitas gas beracun secara taktis perlahan menurun. Analisislah alasan logis mengapa inovasi senjata kimia mematikan tersebut tidak berhasil menjadi penentu kemenangan absolut dalam perang parit.", "o": ["Tingginya ongkos produksi senyawa kimia sehingga pabrik-pabrik di Eropa secara otomatis menghentikan suplainya di tengah peperangan.", "Munculnya inovasi tandingan berupa masker pelindung gas yang dipadukan dengan sifat gas yang sangat bergantung pada arah hembusan angin.", "Penegakan hukum dan traktat internasional yang sangat ketat selama peperangan membuat militer takut mendapatkan sanksi global.", "Senyawa gas beracun pada masa itu memiliki karakter fisik yang justru mudah menguap ke udara sebelum mencapai parit pertahanan musuh.", "Tubuh manusia secara alami beradaptasi dengan cepat sehingga para prajurit infanteri memiliki kekebalan bawaan terhadap racun kimia."]}, {"q": "Selama Perang Dunia I, negara-negara yang bertikai gencar menggunakan instrumen biro propaganda. Mereka mencetak poster, menyensor pemberitaan surat kabar, mendistorsi fakta, dan melebih-lebihkan kejahatan kubu lawan secara sistematis guna membakar semangat warga sipil agar mendukung perang. Berdasarkan pola rekayasa informasi masa lalu tersebut, evaluasilah dampaknya terhadap relevansi kerentanan sosial pada dinamika konflik geopolitik era modern.", "o": ["Sensor ketat dari pihak pemerintah masih sangat dibutuhkan di era internet bebas agar masyarakat luas terhindar dari membaca fakta sejarah.", "Pola propaganda masa lalu membuktikan bahwa kebohongan publik tidak akan bisa bekerja jika tidak disajikan lewat poster kertas berukuran besar.", "Monopoli dan manipulasi informasi demi kepentingan negara sangat identik dengan fenomena misinformasi digital dan perang opini masa kini.", "Selebaran fisik cetak terbukti selamanya menjadi instrumen psikologis satu-satunya yang mampu mengontrol paradigma massa secara total.", "Pemerintah kontemporer tidak akan pernah mau menggunakan metode pengendalian narasi akibat tingkat kecerdasan masyarakat dunia yang merata."]}, {"q": "Dalam kehidupan sehari-hari kita merasakan mudahnya berinteraksi dengan orang dari berbagai negara melalui media sosial. Fenomena ini mempercepat pertukaran budaya, informasi, bahkan ideologi. Apa makna fenomena tersebut dalam konteks globalisasi?", "o": ["Munculnya isolasi budaya antarbangsa", "Hilangnya interaksi sosial antarindividu", "Meningkatnya keterhubungan antarbangsa di dunia", "Terbatasnya pertukaran budaya dan informasi", "Menurunnya komunikasi internasional"]}, {"q": "Banyak produk luar negeri kini lebih mudah ditemukan di pasar Indonesia. Hal ini membuat konsumen memiliki banyak pilihan, tetapi di sisi lain produk lokal harus bersaing ketat. Apa dampak globalisasi ekonomi tersebut?", "o": ["Produk lokal lebih mudah berkembang tanpa persaingan", "Konsumen tidak bisa memilih barang sesuai kebutuhan", "Persaingan global mendorong peningkatan kualitas produk lokal", "Pasar domestik tertutup bagi produk luar negeri", "Masyarakat tidak lagi tertarik pada produk baru"]}, {"q": "Perkembangan internet dan smartphone telah mengubah cara masyarakat berkomunikasi. Kini, pesan dapat dikirim dalam hitungan detik melalui berbagai aplikasi.  Apa dampak utama perkembangan iptek tersebut terhadap pola komunikasi manusia?", "o": ["Komunikasi menjadi lebih lambat dan terbatas", "Interaksi sosial hanya bisa dilakukan secara tatap muka", "Komunikasi berlangsung cepat dan lintas batas wilayah", "Hubungan antarmanusia semakin terputus", "Komunikasi tidak lagi dianggap penting"]}, {"q": "Dengan hadirnya transportasi modern seperti kereta cepat, mobil listrik, dan pesawat berteknologi tinggi, jarak tempuh semakin singkat dan efisien.  Bagaimana dampak perkembangan teknologi transportasi tersebut dalam kehidupan sehari-hari?", "o": ["Meningkatkan keterhubungan antarwilayah dan mobilitas manusia", "Membatasi hubungan antarwilayah karena biaya transportasi naik", "Mengurangi kesempatan masyarakat untuk bepergian", "Menghapuskan transportasi tradisional sepenuhnya", "Membuat masyarakat enggan melakukan perjalanan"]}, {"q": "Selama pandemi Covid-19, proses belajar mengajar banyak dilakukan secara daring melalui aplikasi video conference. Hal ini menunjukkan bahwa iptek berperan penting dalam pendidikan.  Apa manfaat perkembangan iptek dalam bidang pendidikan?", "o": ["Membatasi akses pendidikan hanya di kota besar", "Memperluas akses pembelajaran tanpa batas ruang dan waktu", "Mengurangi interaksi guru dan siswa sehingga pembelajaran gagal", "Menutup kesempatan siswa belajar dari sumber global", "Membuat pendidikan tradisional hilang sama sekali"]}, {"q": "Kebijakan Appeasement (peredaan ketegangan) yang diterapkan oleh Inggris dan Prancis terhadap Jerman Nazi pada Konferensi Munich 1938 sering dianggap sebagai blunder fatal diplomatik. Melalui kebijakan ini, Sekutu membiarkan Hitler menganeksasi wilayah Sudetenland dari Cekoslowakia demi mencegah pecahnya perang terbuka. Berdasarkan analisis sejarah geopolitik, mengapa strategi diplomasi tersebut justru mempercepat meletusnya Perang Dunia II?", "o": ["Keputusan tersebut memaksa Amerika Serikat untuk langsung menjatuhkan sanksi ekonomi dan blokade laut kepada perairan Jerman.", "Strategi itu meyakinkan Hitler bahwa negara-negara demokrasi Barat bersikap lemah dan tidak memiliki keberanian untuk berperang.", "Kesepakatan Munich secara otomatis membubarkan institusi militer Liga Bangsa-Bangsa di kancah perpolitikan internasional.", "Traktat tersebut memberikan Cekoslowakia hak veto penuh dalam sidang dewan keamanan wilayah perbatasan di Eropa Timur.", "Kebijakan tersebut menyadarkan Uni Soviet untuk segera bergabung membentuk persekutuan militer abadi dengan blok Sekutu."]}, {"q": "Perhatikan data perkiraan produksi pesawat tempur selama Perang Dunia II pada kurun waktu 1939-1945 berikut: Amerika Serikat memproduksi 324.000 unit; Uni Soviet memproduksi 157.000 unit; Inggris memproduksi 131.000 unit; Jerman memproduksi 119.000 unit; dan Jepang memproduksi 76.000 unit. Berdasarkan perbandingan kuantitatif data logistik militer tersebut, kesimpulan paling rasional yang menjelaskan kekalahan kekuatan udara blok Poros (Jerman dan Jepang) adalah...", "o": ["Inggris secara mandiri mampu memproduksi armada udara tempur yang jumlahnya melebihi total gabungan seluruh negara lawan.", "Jerman dan Jepang gagal memproduksi pesawat karena wilayah industri mereka telah sepenuhnya beralih fungsi menjadi lahan pertanian.", "Tingkat produksi pesawat terbang Uni Soviet merupakan yang paling dominan dan menjadi satu-satunya penentu kemenangan di Eropa.", "Blok Sekutu secara gabungan memiliki keunggulan kapasitas industri manufaktur lebih dari tiga kali lipat dibandingkan blok Poros.", "Produksi pesawat tempur blok Poros memiliki spesifikasi teknis dan material baja yang sengaja diturunkan kualitasnya oleh pemerintah."]}, {"q": "Tragedi Holocaust yang dikoordinasikan secara sistematis oleh rezim Nazi Jerman menewaskan jutaan kaum Yahudi dan kelompok minoritas lainnya. Fakta-fakta pembantaian dan eksperimen medis kejam ini terungkap secara terbuka dalam Pengadilan Nuremberg pascaperang. Analisislah kontribusi hukum yang paling fundamental dari terselenggaranya peradilan internasional tersebut terhadap perkembangan instrumen kemanusiaan global saat ini.", "o": ["Menginisiasi berdirinya pengadilan militer rahasia yang dikendalikan eksklusif oleh negara-negara pemenang tanpa adanya asas praduga tak bersalah.", "Menetapkan preseden hukum absolut bahwa para pemimpin negara dan pejabat tinggi dapat dituntut secara pidana atas kejahatan terhadap kemanusiaan.", "Menghapuskan sistem peradilan perdata di wilayah Eropa Barat dan menggantinya dengan hukum militer universal yang sangat represif dan kaku.", "Memberikan kekebalan hukum secara penuh kepada seluruh prajurit berpangkat rendah yang sekadar mematuhi perintah eksekusi dari atasan mereka.", "Mewajibkan negara-negara yang kalah perang untuk mendeportasi seluruh tawanan perang yang tersisa kepada lembaga intelijen swasta milik Sekutu."]}, {"q": "Perserikatan Bangsa-Bangsa (PBB) dibentuk untuk mengoreksi kelemahan Liga Bangsa-Bangsa demi memelihara stabilitas dunia. Namun, pemberian instrumen “Hak Veto” kepada lima negara Anggota Tetap Dewan Keamanan (AS, Inggris, Prancis, Rusia, Tiongkok) pada praktiknya sering membuat PBB lumpuh dan mandek dalam menangani agresi militer yang melibatkan kepentingan sekutu kelima negara tersebut. Apabila Anda mendesain ulang mekanisme pengambilan keputusan di Dewan Keamanan PBB demi keadilan prosedural, rancangan struktural manakah yang paling rasional untuk diterapkan?", "o": ["Mengalihkan secara penuh seluruh kuota hak veto istimewa tersebut kepada organisasi-organisasi non-pemerintah lintas negara yang bersifat nirlaba.", "Membubarkan institusi Dewan Keamanan selamanya dan mengembalikan seluruh wewenang penyelesaian konflik ke tangan pengadilan militer nasional.", "Menghapuskan hak veto individual dan menggantinya dengan sistem pemungutan suara mayoritas ganda yang representatif berdasarkan persentase anggota.", "Menambah kuota pemegang hak veto secara tak terbatas bagi setiap negara berkembang yang pernah memiliki sejarah peradaban kerajaan masa lampau.", "Mewajibkan lima negara pemegang hak veto konvensional untuk menyerahkan komando angkatan laut mereka kepada markas besar staf militer PBB."]}, {"q": "Setelah Perang Dunia II, dunia terbagi menjadi dua blok: Amerika Serikat dengan kapitalisme-liberalismenya dan Uni Soviet dengan sosialisme-komunismenya. Persaingan ini melahirkan Perang Dingin. Apa faktor utama munculnya Perang Dingin?", "o": ["Keinginan bersama membentuk PBB", "Perbedaan ideologi dan sistem politik-ekonomi", "Keinginan negara-negara untuk merdeka", "Perang Dunia I yang belum terselesaikan", "Persaingan antara negara jajahan di Asia"]}, {"q": "Amerika Serikat membentuk NATO (1949), sementara Uni Soviet membentuk Pakta Warsawa (1955). Kedua aliansi militer ini memperlihatkan rivalitas blok.\nApa tujuan utama pembentukan dua pakta militer tersebut?", "o": ["Menyebarkan pengaruh budaya masing-masing bloke", "menjaga perdamaian dunia tanpa konflik antar kawasan", "Menunjukkan dominasi teknologi pertanian", "Menguatkan pertahanan dan pengaruh ideologi masing-masing", "Menghapus batas wilayah antarnegara yang menjadi sesama anggota"]}, {"q": "Rivalitas AS dan Uni Soviet juga tampak dalam perlombaan senjata nuklir dan penjelajahan luar angkasa. Hal ini menunjukkan bahwa Perang Dingin tidak hanya berlangsung di bidang militer. Apa makna dari perlombaan tersebut?", "o": ["Bentuk kerja sama internasional dalam penelitian", "Upaya dominasi pengaruh politik dan teknologi global", "Penolakan kedua negara terhadap modernisasi", "Kesepakatan bersama membatasi penggunaan nuklir", "Perlawanan negara berkembang terhadap kedua blok"]}, {"q": "Pada periode 1960–1980-an, Perang Dingin memasuki fase kedua dengan konflik di negara-negara dunia ketiga, misalnya Perang Vietnam dan Perang Afghanistan.\nApa dampak utama fase ini bagi negara dunia ketiga?", "o": ["Mereka menjadi ajang perebutan pengaruh dua blok besar", "Mereka terbebas dari semua bentuk pengaruh blok besar", "Mereka menguasai dunia dengan kekuatan ekonomi baru", "Mereka menolak semua bantuan luar negeri", "Mereka menjadi pusat perdamaian dunia"]}, {"q": "Runtuhnya Tembok Berlin tahun 1989 menjadi simbol berakhirnya Perang Dingin. Tidak lama kemudian, Uni Soviet bubar (1991).\nApa faktor utama yang menyebabkan runtuhnya Uni Soviet?", "o": ["Kekuatan ekonomi Uni Soviet semakin meningkan melalui penjualan senjata kenagara-negara konflik", "Tekanan internasional untuk membuka pasar bebas", "Krisis ekonomi internal dan kebijakan reformasi (glasnost & perestroika)", "Dukungan rakyat terhadap komunisme semakin besar", "Kemenangan Uni Soviet dalam perlombaan senjata serta perubahan arah pandangan (glasnost & perestroika)"]}, {"q": "Berakhirnya Perang Dingin mengubah pola hubungan internasional. Negara-negara lebih fokus pada globalisasi ekonomi.\nApa dampak positif yang ditimbulkan?", "o": ["Semua negara otomatis menjadi negara maju", "Perekonomian dunia lebih terbuka dan kerja sama internasional meningkat", "Dunia menjadi lebih tertutup dari pengaruh luar", "Negara berkembang berhenti melakukan pembangunan dan kerja sama internasional meningkat", "Negara maju menutup akses perdagangan global dan kerja sama internasional meningkat"]}, {"q": "Selain ekonomi, Perang Dingin berdampak pada budaya populer, seperti film dan musik, yang sering digunakan sebagai alat propaganda.\nApa makna fenomena ini?", "o": ["Budaya populer bebas dari pengaruh politik", "Semua budaya ditolak oleh masyarakat global", "Budaya tidak berhubungan dengan kekuatan politik", "Budaya digunakan sebagai media penyebaran ideologi", "Budaya berhenti berkembang setelah Perang Dingin"]}, {"q": "Mempelajari Perang Dingin membantu siswa memahami dinamika politik internasional dan peran Indonesia dalam menjaga netralitas.\nMengapa penting bagi generasi muda Indonesia merefleksikan sejarah Perang Dingin?", "o": ["Agar mereka mengulangi konflik ideologi dunia", "Agar mereka menutup diri dari pergaulan internasional", "Agar mereka bisa membangun sikap kritis terhadap konflik global dan memperkuat diplomasi Indonesia", "Agar mereka tidak mempelajari sejarah global sama sekali", "Agar mereka hanya mengandalkan kekuatan militer dalam diplomasi"]}, {"q": "Setelah Perang Dunia II, Amerika Serikat membentuk NATO (1949) sebagai organisasi militer regional yang menghimpun negara-negara Eropa Barat. Tujuannya adalah menjaga keamanan bersama dari ancaman blok Timur. Apa makna pembentukan NATO bagi dunia?", "o": ["Menyatukan semua negara di dunia tanpa membedakan ideologi", "Menjadi simbol persaingan ideologi dalam Perang Dingin", "Membatasi kerja sama ekonomi negara-negara Eropa", "Membuka jalan bagi kolonialisasi kembali di Asia-Afrika", "Menghapus perbedaan budaya antarnegara"]}, {"q": "SEATO (Southeast Asia Treaty Organization) dibentuk tahun 1954 dengan tujuan menahan penyebaran komunisme di Asia Tenggara. Namun, organisasi ini tidak bertahan lama.\nApa penyebab utama lemahnya pengaruh SEATO?", "o": ["Tidak mendapat dukungan Amerika Serikat", "Negara-negara Asia Tenggara lebih memilih ASEAN", "Anggota SEATO sebagian besar bukan dari Asia Tenggara", "Uni Soviet ikut menjadi anggota aktif", "Fokus SEATO hanya pada bidang ekonomi"]}, {"q": "Pakta Pertahanan Atlantik Utara (NATO) didirikan pada tahun 1949 dengan prinsip dasar “collective defense” atau pertahanan kolektif yang tertuang dalam Pasal 5 traktatnya. Prinsip tersebut menyatakan bahwa serangan bersenjata terhadap salah satu anggota di Eropa atau Amerika Utara akan dianggap sebagai serangan terhadap seluruh anggota aliansi. Analisislah alasan strategis paling fundamental mengapa Amerika Serikat menginisiasi klausul pertahanan kolektif tersebut pada fase awal Perang Dingin.", "o": ["Memastikan dominasi militer Amerika Serikat dalam mengeksploitasi sumber daya alam di negara-negara Eropa Barat.", "Membentuk kekuatan militer tandingan untuk langsung menyerang dan menghancurkan pusat pemerintahan Uni Soviet.", "Mencegah ekspansi pengaruh ideologi komunisme Uni Soviet di wilayah Eropa Barat melalui efek gentar aliansi militer.", "Memfasilitasi pembentukan pemerintahan dunia tunggal di bawah kendali penuh dewan keamanan Perserikatan Bangsa-Bangsa.", "Mengurangi beban anggaran pertahanan Amerika Serikat dengan membebankan biaya keamanan sepenuhnya kepada sekutu Eropanya."]}, {"q": "Perhatikan data kronologi keanggotaan NATO berikut: saat didirikan pada tahun 1949, NATO memiliki 12 negara anggota. Menjelang berakhirnya era Perang Dingin pada tahun 1990, jumlah keanggotaan mencapai 16 negara. Pasca-runtuhnya Uni Soviet, aliansi ini terus berekspansi ke wilayah Eropa Timur sehingga pada tahun 2024 jumlah anggotanya melonjak menjadi 32 negara. Berdasarkan data ekspansi keanggotaan tersebut, evaluasilah dampak geopolitik paling nyata dari pertumbuhan numerik keanggotaan NATO pasca-Perang Dingin terhadap stabilitas kawasan Eurasia.", "o": ["Ekspansi tersebut menciptakan perdamaian abadi di seluruh wilayah bekas Uni Soviet tanpa memicu perlombaan senjata baru.", "Penambahan anggota ini memicu persepsi ancaman keamanan bagi Rusia yang berujung pada konflik teritorial modern.", "Peningkatan negara anggota secara otomatis membubarkan institusi Pakta Warsawa tanpa melalui instrumen perjanjian diplomatik.", "Pertumbuhan jumlah sekutu membuat Pakta Pertahanan Atlantik Utara mengalami kebangkrutan operasional secara permanen.", "Seluruh anggota yang baru bergabung segera melepaskan kedaulatan nasionalnya untuk dilebur menjadi satu negara adidaya."]}, {"q": "Pembentukan aliansi militer Barat direspons oleh Uni Soviet dan negara-negara satelitnya dengan mendirikan Pakta Warsawa pada tahun 1955. Pemicu utama lahirnya pakta tahanan militer tandingan ini bukanlah semata-mata karena eksistensi NATO yang sudah ada sejak 1949, melainkan adanya kebijakan spesifik dari blok Barat yang dianggap amat membahayakan posisi geopolitik Uni Soviet saat itu. Kebijakan strategis blok Barat yang dimaksud adalah...", "o": ["Penempatan rudal nuklir balistik berdaya ledak tinggi oleh militer Amerika Serikat di sepanjang perbatasan semenanjung Korea.", "Pemasukan kembali negara Jerman Barat sebagai anggota penuh aliansi Atlantik Utara yang diikuti dengan izin remiliterisasi.", "Pembangunan Tembok Berlin secara sepihak oleh pemerintahan demokratis Jerman Barat demi memblokir gelombang pengungsi.", "Penerapan Doktrin Truman yang secara terbuka memberikan bantuan suplai senjata dan logistik kepada kelompok pemberontak di Moskow.", "Pemutusan seluruh hubungan diplomatik dan ekonomi lintas benua antara Inggris Raya dengan negara-negara satelit di kawasan Eropa Timur."]}, {"q": "Pasca-runtuhnya Uni Soviet pada tahun 1991, alasan fundamental historis berdirinya NATO sebagai penangkal ideologi komunis secara praktis telah lenyap. Meski demikian, organisasi ini menolak dibubarkan dan justru bertransformasi. Apabila Anda bertindak sebagai perancang strategi keamanan global, desain peran baru yang paling relevan bagi NATO untuk mempertahankan eksistensi dan urgensinya di abad ke-21 adalah...", "o": ["Membatasi peran operasional militer secara eksklusif hanya untuk menanggulangi bencana alam vulkanik di negara-negara Amerika Utara.", "Mengubah fungsi pokok dari aliansi militer menjadi organisasi ekonomi murni yang mengatur nilai fluktuasi mata uang internasional.", "Mengembangkan kapasitas respons cepat pertahanan terhadap ancaman keamanan non-tradisional seperti terorisme global dan serangan siber.", "Menyerahkan seluruh sistem komando militer persekutuan ke bawah kewenangan mahkamah peradilan hak asasi manusia secara mutlak.", "Mengembalikan doktrin pertahanan lama melalui konsep kolonialisme teritorial untuk menguasai kembali jalur perdagangan maritim kuno."]}, {"q": "Sepanjang sejarah berdirinya Pakta Pertahanan Atlantik Utara, Klausul Pertahanan Kolektif (Pasal 5) baru diaktifkan satu kali dalam sejarah institusi tersebut. Pengaktifan bersejarah ini terjadi pasca-serangan teroris 11 September 2001 (9/11) terhadap Amerika Serikat. Analisislah makna penting dari perubahan paradigma operasional militer NATO yang tercermin dari peristiwa pengaktifan pasal monumental tersebut.", "o": ["Aliansi ini membuktikan kelemahannya karena gagal meramalkan serangan musuh konvensional yang berasal dari kawasan Uni Eropa.", "Operasi militer persekutuan berubah secara radikal dari fokus menghadapi ancaman negara berdaulat menjadi memerangi aktor non-negara.", "Pakta pertahanan ini secara resmi mengalihkan fokus utamanya untuk memonopoli industri persenjataan militer di benua Afrika.", "Ruang lingkup teritorial keanggotaan terpaksa dikurangi secara drastis demi menghemat anggaran operasional penanggulangan terorisme.", "Traktat dasar pendirian organisasi direvisi total guna mencabut hak istimewa militer Amerika Serikat dalam setiap perundingan damai."]}, {"q": "Organisasi Negara-Negara Pengekspor Minyak (OPEC) didirikan pada Konferensi Baghdad tahun 1960 oleh lima negara pemrakarsa: Iran, Irak, Kuwait, Arab Saudi, dan Venezuela. Sebelum pembentukan organisasi ini, industri minyak global dikendalikan secara mutlak oleh kartel perusahaan multinasional Barat yang dikenal dengan sebutan “Seven Sisters”. Analisislah motif ekonomi-politik utama yang mendorong kelima negara berkembang tersebut bersatu mendirikan institusi OPEC pada era tersebut.", "o": ["Memperkuat hegemoni negara-negara Timur Tengah atas perumusan kebijakan sistem moneter di pasar valuta asing internasional.", "Menasionalisasi secara paksa seluruh ladang eksplorasi yang dikuasai perusahaan Amerika Serikat di dataran benua Eropa.", "Menetapkan harga jual minyak mentah secara mandiri untuk melindungi penerimaan negara dari eksploitasi sepihak kartel Barat.", "Menyepakati pembentukan mata uang tunggal baru guna mendanai revolusi industri manufaktur di wilayah internal anggota.", "Meruntuhkan dominasi negara-negara Blok Timur dalam mendistribusikan cadangan energi batu bara selama masa Perang Dingin."]}, {"q": "Pada bulan Oktober 1973, negara-negara Arab anggota OPEC (OAPEC) memberlakukan embargo minyak terhadap negara-negara industri yang secara terang-terangan mendukung Israel dalam Perang Yom Kippur. Data historis pergerakan pasar mencatat bahwa pasokan global yang menyusut tajam menyebabkan harga minyak mentah dunia melonjak dari rata-rata $3 per barel menjadi $12 per barel hanya dalam kurun waktu empat bulan. Mengevaluasi lonjakan harga sebesar 300 persen tersebut, dampak paling signifikan terhadap konstelasi politik ekonomi global saat itu adalah...", "o": ["Amerika Serikat segera menghentikan seluruh aktivitas eksplorasi energi fosil domestiknya demi menjaga stabilitas ekosistem lingkungan.", "Krisis energi global memicu inflasi masif di negara industri sekaligus membuktikan kekuatan geopolitik dari komoditas milik negara berkembang.", "Negara-negara Eropa Barat bersepakat untuk membubarkan aliansi militer secara permanen akibat kebangkrutan struktur pendanaan nasionalnya.", "Perekonomian negara anggota OPEC mengalami kehancuran absolut akibat hilangnya akses pasar ekspor utama mereka di wilayah benua Amerika.", "Perserikatan Bangsa-Bangsa mencabut hak istimewa veto militer yang dimiliki kelompok sekutu Barat dalam sidang rutin Dewan Keamanan."]}, {"q": "Indonesia secara resmi bergabung menjadi anggota penuh OPEC pada tahun 1962. Namun, dinamika perekonomian memaksa pemerintah untuk membekukan sementara (suspend) keanggotaannya pada tahun 2008 dan 2016. Faktor pemicu utamanya adalah tren penurunan kapasitas produksi sumur minyak domestik yang berbenturan dengan lonjakan angka konsumsi bahan bakar dalam negeri, sehingga mengubah status Indonesia dari eksportir murni menjadi importir neto energi. Apabila Anda bertindak sebagai perumus kebijakan strategis nasional dalam merespons defisit neraca tersebut, desain langkah fundamental yang harus segera diimplementasikan adalah...", "o": ["Bergabung kembali ke dalam keanggotaan institusi tersebut demi menuntut jatah pasokan minyak gratis yang diwajibkan bagi sesama anggota.", "Memaksa seluruh industri manufaktur berskala besar untuk menutup pabriknya guna menghemat rasio cadangan bahan bakar strategis nasional.", "Menasionalisasi seluruh aset operasional korporasi asing tanpa ganti rugi finansial demi memonopoli sisa sumur tua yang masih beroperasi.", "Mengakselerasi peta jalan transisi menuju energi baru dan terbarukan seraya merumuskan regulasi ketat terkait efisiensi konsumsi bahan bakar.", "Mengimpor seratus persen kebutuhan energi listrik dari negara tetangga agar pemerintah tidak perlu lagi mengalokasikan anggaran pembangunan kilang."]}, {"q": "Banyak peristiwa revolusi besar dunia pada abad ke-20 terjadi karena tuntutan rakyat terhadap demokrasi, hak asasi manusia, dan keadilan sosial. Jika dikaitkan dengan Indonesia, peristiwa manakah yang memiliki kesamaan nilai dengan Reformasi 1998?", "o": ["Runtuhnya Vietnam Selatan", "Berakhirnya Apartheid di Afrika Selatan", "Perpecahan Cekoslowakia", "Jatuhnya Tembok Berlin", "People Power di Filipina"]}, {"q": "Setelah berakhirnya Perang Dingin, ideologi liberal demokrasi semakin dominan di dunia. Banyak negara komunis beralih ke sistem ekonomi pasar. Apa dampak global dari perubahan ini?", "o": ["Munculnya ketegangan baru antara Afrika Selatan dan Vietnam", "Runtuhnya pengaruh teknologi di Asia", "Berakhirnya semua konflik etnis di Eropa Timur", "Meningkatnya globalisasi ekonomi dan politik", "Dominasi penuh organisasi militer regional"]}, {"q": "Tumbangnya berbagai negara besar pada abad ke-20 menyimpan banyak pelajaran berharga bagi praktik berdemokrasi di era modern saat ini. Refleksi apa yang sepatutnya dipetik oleh bangsa Indonesia dari peristiwa tersebut?", "o": ["Demokrasi hanya berhasil jika didukung negara adidaya", "Peran rakyat sangat penting dalam menjaga stabilitas politik", "Setiap negara pasti mengalami perpecahan", "Indonesia tidak memiliki kaitan dengan peristiwa global", "Semua revolusi selalu berdampak negatif"]}, {"q": "Pakta Warsawa dibentuk pada tanggal 14 Mei 1955 sebagai aliansi pertahanan militer negara-negara komunis di kawasan Eropa Timur yang berada di bawah komando Uni Soviet. Secara resmi, organisasi pakta pertahanan ini dideklarasikan sebagai langkah perlindungan terhadap ancaman dari blok Barat. Analisislah kebijakan politik militer spesifik dari kubu blok Barat yang menjadi katalisator langsung bagi Uni Soviet untuk mempercepat pendirian Pakta Warsawa pada tahun tersebut.", "o": ["Bergabungnya Jerman Barat ke dalam keanggotaan Pakta Pertahanan Atlantik Utara yang diiringi dengan izin remiliterisasi secara terbuka.", "Peluncuran satelit luar angkasa pertama oleh pemerintah Amerika Serikat yang dikhawatirkan mengancam kedaulatan teritorial Eropa Timur.", "Pembangunan pangkalan armada laut rahasia milik militer Inggris secara besar-besaran di perairan internasional dekat perbatasan Krimea.", "Penerapan resolusi ekonomi khusus yang mewajibkan seluruh negara benua Eropa Barat memutus total hubungan perniagaan dengan Moskow.", "Penandatanganan pakta non-agresi militer antara Republik Prancis dan Tiongkok yang melemahkan dominasi ideologi komunis di wilayah Asia."]}, {"q": "Perhatikan data estimasi personel militer aktif negara-negara anggota Pakta Warsawa pada masa puncak Perang Dingin (dekade 1980-an) berikut: Angkatan Bersenjata Uni Soviet memiliki lebih kurang 4.000.000 personel; Polandia memiliki 320.000 personel; Cekoslowakia memiliki 200.000 personel; Jerman Timur memiliki 170.000 personel; dan Rumania memiliki 180.000 personel. Berdasarkan persentase kuantitatif kekuatan militer tersebut, evaluasilah dampak ketimpangan postur pasukan ini terhadap dinamika pengambilan keputusan strategis di dalam internal aliansi.", "o": ["Negara-negara anggota yang lebih kecil secara berkala mengambil alih komando operasi militer secara bergilir tanpa melibatkan perwira asal Rusia.", "Cekoslowakia dan Polandia pada akhirnya berhasil membentuk persekutuan militer tersendiri yang mampu menandingi kuantitas pasukan Uni Soviet.", "Dominasi personel Soviet yang melebihi delapan puluh persen dari total pasukan membuktikan bahwa aliansi ini mutlak menjadi alat hegemoni Moskow.", "Negara-negara satelit di kawasan Eropa Timur secara sukarela melucuti seluruh pasukannya demi menghemat anggaran pengeluaran bersama organisasi.", "Uni Soviet terpaksa merancang ulang seluruh kebijakan luar negerinya semata-mata demi mengikuti hasil pemungutan suara mayoritas dari negara sekutu."]}, {"q": "Pada tahun 1968, pasukan gabungan Pakta Warsawa melakukan invasi militer berskala besar ke Cekoslowakia guna memadamkan gerakan reformasi politik dan demokratisasi yang dikenal dengan peristiwa “Musim Semi Praha” (Prague Spring). Tindakan invasi represif ini kemudian dijustifikasi oleh pimpinan Soviet melalui Doktrin Brezhnev. Berdasarkan peristiwa sejarah tersebut, evaluasilah bentuk penyimpangan fungsional organisasi aliansi militer tersebut jika dikomparasikan dengan prinsip ideal sebuah pakta pertahanan internasional.", "o": ["Pakta pertahanan militer tersebut secara eksklusif hanya difungsikan untuk menjaga perbatasan ekonomi tanpa pernah mencampuri urusan politik praktis.", "Pakta pertahanan yang idealnya melindungi anggota dari serangan luar justru disalahgunakan untuk menekan kedaulatan politik negara anggota internalnya.", "Pasukan aliansi terbukti senantiasa patuh dalam menjalankan mandat perdamaian global dengan menyerahkan resolusi sengketa kepada peradilan sipil.", "Penggunaan kekuatan militer gabungan itu merupakan implementasi sah dan demokratis untuk mencegah masuknya bantuan kemanusiaan dari wilayah Barat.", "Tujuan sentral aliansi untuk menyatukan Eropa Timur berhasil dicapai secara damai melalui referendum masyarakat sipil sebelum pengerahan militer dilakukan."]}, {"q": "Proses keruntuhan Uni Soviet tidak terlepas dari kebijakan pembaharuan politik dan ekonomi yang digulirkan oleh pemimpin tertingginya pada masa itu. Siapakah tokoh kunci yang memimpin reformasi tersebut?", "o": ["Nikita Khrushchev", "Leonid Brezhnev", "Vladimir Lenin", "Mikhail Gorbachev", "Boris Yeltsin"]}, {"q": "Pembubaran negara adidaya Uni Soviet dipicu oleh akumulasi persoalan internal yang pelik hingga membuat sistem pemerintahannya lumpuh. Apa faktor utama yang mendasari perpecahan tersebut?", "o": ["Invasi militer oleh AS", "Kemenangan komunisme global", "Melemahnya NATO dan lemahnya pemerintahan pusat", "Kudeta dari partai komunis", "Krisis ekonomi dan lemahnya pemerintahan pusat"]}, {"q": "Seusai pembubaran Uni Soviet, wilayah teritorial terbesar mendeklarasikan diri sebagai negara merdeka penerus kekuasaan utama kawasan tersebut. Republik manakah yang dimaksud?", "o": ["Ukraina", "Belarusia", "Rusia", "Georgia", "Kazakhstan"]}, {"q": "Pada masa Perang Dingin, polarisasi kekuatan dunia terbelah menjadi Blok Barat yang mengusung ideologi kapitalis dan Blok Timur dengan ideologi komunis. Di tengah ancaman perang nuklir yang eskalatif, Indonesia memprakarsai pembentukan Gerakan Non-Blok (GNB) pada Konferensi Beograd tahun 1961. Secara geopolitik, kebijakan luar negeri bebas aktif ini diambil bukan berarti Indonesia bersikap netral pasif tanpa arah tujuan. Analisislah manifestasi dari sikap “aktif” diplomasi kenegaraan Indonesia melalui keikutsertaannya dalam Gerakan Non-Blok tersebut terhadap konstelasi politik global masa itu.", "o": ["Menarik seluruh perwakilan diplomatik dari forum Perserikatan Bangsa-Bangsa guna menghindari pusaran konfrontasi bersenjata dunia.", "Membentuk aliansi militer regional yang bersifat agresif untuk menyerang pangkalan logistik milik Blok Timur di Asia.", "Menyediakan kawasan perairan strategis nasional sebagai pangkalan peluncuran misil balistik bagi negara-negara demokrasi.", "Meredakan ketegangan dua negara adidaya sekaligus menyuarakan hak kemerdekaan dan dekolonisasi bagi bangsa yang terjajah.", "Mewajibkan setiap negara berkembang di benua Asia dan Afrika untuk memboikot kerja sama ekonomi dengan pihak Blok Barat."]}, {"q": "Kebijakan containment yang diterapkan Amerika Serikat selama Perang Dingin bertujuan untuk ....", "o": ["membendung penyebaran pengaruh komunisme Uni Soviet", "menyerang Uni Soviet secara langsung dengan senjata nuklir", "membentuk aliansi militer bersama Uni Soviet", "mengakhiri Perang Dunia II di Eropa", "mendukung perluasan komunisme di negara-negara Eropa Barat"]}, {"q": "Program Bantuan Marshall Plan yang diluncurkan Amerika Serikat pada tahun 1948 bertujuan untuk ....", "o": ["membentuk pakta militer bersama negara-negara Eropa Timur", "membantu pemulihan ekonomi Eropa Barat agar tidak jatuh ke pengaruh komunisme", "mengirim pasukan NATO ke Vietnam Selatan", "mendirikan Tembok Berlin sebagai batas wilayah", "membubarkan Pakta Warsawa"]}, {"q": "Krisis Rudal Kuba pada tahun 1962 berhasil diakhiri dengan kesepakatan bahwa ....", "o": ["Uni Soviet menarik rudalnya dari Kuba dan Amerika Serikat berjanji tidak menyerang Kuba", "Amerika Serikat menyerahkan Kuba kepada Uni Soviet", "NATO membubarkan diri secara permanen", "Uni Soviet bergabung dengan Pakta Pertahanan Atlantik Utara (NATO)", "Jerman Barat dan Jerman Timur bersatu kembali"]}];

 <h1>SMA NEGERI 1 PENENGAHAN</h1><p class="sub">Computer Based Test (CBT)</p>
 <div class="ident"><div>Kegiatan<b>UJIAN SEMESTER GANJIL</b></div><div>Mata Pelajaran<b>SEJARAH TINGKAT LANJUT</b></div><div>Kelas<b>XII SMA</b></div><div>Tahun Pelajaran<b>2026/2027</b></div></div>
 <label for="nm">Nama lengkap siswa</label><input id="nm" autocomplete="off" placeholder="Ketik nama lengkap">
 <label for="kl">Kelas</label><select id="kl"><option value="">– Pilih kelas –</option>${KELAS.map(k=>`<option>${k}</option>`).join("")}</select>
 <label for="tk">Token ujian</label><input id="tk" autocomplete="off" placeholder="Token dari pengawas" style="text-transform:uppercase;letter-spacing:2px;font-weight:700">
 <div class="err" id="er">${msg||""}</div>
 <button class="btn primary full" id="go">${ic.play} MULAI UJIAN</button>
 <button class="link" id="gr">Masuk sebagai guru</button>
 </div></div>`);
 $("#go").onclick=doLogin;$("#gr").onclick=askPin;
 $("#nm").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
}
async function doLogin(){
 const nama=$("#nm").value.trim().replace(/\s+/g," "), kelas=$("#kl").value, er=$("#er");
 if(nama.length<3){er.textContent="Nama lengkap wajib diisi (minimal 3 huruf).";return}
 if(!kelas){er.textContent="Silakan pilih kelas terlebih dahulu.";return}
 const tk=$("#tk").value.trim().toUpperCase();
 if(!tk){er.textContent="Token ujian wajib diisi.";return}
 er.textContent="Memeriksa token…";await loadConfig();er.textContent="";
 if(tk!==String(CFG.token).toUpperCase()){er.textContent="Token salah atau sudah kedaluwarsa. Minta token hari ini kepada pengawas.";return}
 const id=slug(nama,kelas);sesKey="cbt_sesi_"+id;
 const done=(store.get("cbt_hasil")||[]).find(r=>r.id===id);
 if(done){S={nama,kelas,phase:"selesai",result:done,sent:true};return showDone()}
 try{if(db){const d=await Promise.race([db.collection("hasil").doc(id).get(),new Promise((_,r)=>setTimeout(r,3000))]);if(d&&d.exists){S={nama,kelas,phase:"selesai",result:d.data(),sent:true};return showDone()}}}catch(e){}
 S=store.get(sesKey);
 if(!S){S={id,nama,kelas,phase:"petunjuk",order:shuffle([...Array(TOTAL).keys()]),perm:{},ans:{},flag:{},cur:0,viol:0,locked:false,sent:false};
  S.order.forEach(q=>S.perm[q]=shuffle([0,1,2,3,4]));save()}
 route();
}
function route(){
 if(S.phase==="petunjuk")showGuide();
 else if(S.phase==="ujian")startExam(true);
 else if(S.phase==="terkirim")showSubmitted();
 else if(S.phase==="hasil")showResult();
 else showDone();
}

function showGuide(){
 const t=["Berdoalah sebelum mengerjakan soal.","Bacalah soal dengan teliti.","Pilih satu jawaban yang paling benar.","Siswa dapat berpindah antarsoal menggunakan tombol navigasi.","Jawaban tersimpan otomatis selama sesi ujian.","Pastikan semua soal sudah dijawab sebelum mengirim jawaban.","Setelah dikirim, jawaban tidak dapat diubah kembali."];
 view(`<div class="center screen"><div class="card guide">
 <h1>PETUNJUK UJIAN</h1><p class="sub">${esc(S.nama)} · Kelas ${esc(S.kelas)} · ${TOTAL} soal pilihan ganda</p>
 <ol>${t.map((x,i)=>`<li><i>${i+1}</i><span>${x}</span></li>`).join("")}</ol>
 <div class="alert">Waktu ujian ${CFG.durasi} menit dan mulai berjalan saat Anda menekan MULAI MENGERJAKAN. Jawaban terkirim otomatis ketika waktu habis. Ujian berjalan dalam mode layar penuh. Berpindah tab, meminimalkan browser, atau keluar dari layar penuh dicatat sebagai pelanggaran. Pelanggaran ke-${MAXV} mengunci ujian dan Anda harus menghubungi pengawas.</div>
 <button class="btn primary full" style="margin-top:18px" id="st">${ic.play} MULAI MENGERJAKAN</button></div></div>`);
 $("#st").onclick=()=>{S.phase="ujian";S.mulai=Date.now();S.durasi=CFG.durasi;save();goFull();startExam(false)};
}
function goFull(){try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||function(){return Promise.reject()}).call(e).catch(()=>{})}catch(e){}}
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const canFull=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);

/* ---------- UJIAN ---------- */
let monitoring=false;
function startExam(resumed){
 monitoring=false;renderExam();
 setTimeout(()=>{monitoring=true},1500);startTimer();
 if(S.locked)showLock();
 else if(resumed&&canFull()&&!isFull()){modal(`<h2>Lanjutkan ujian</h2><p>Sesi Anda sebelumnya masih tersimpan. Tekan tombol di bawah untuk kembali ke mode layar penuh.</p><div class="row"><button class="btn primary" id="rf">${ic.play} LANJUTKAN</button></div>`);$("#rf").onclick=()=>{goFull();closeModal()}}
}
function counts(){const a=Object.keys(S.ans).length;return{a,b:TOTAL-a,d:Object.keys(S.flag).filter(k=>S.flag[k]).length}}
function renderExam(){
 const qi=S.order[S.cur],q=QB[qi],c=counts(),perm=S.perm[qi];
 const opts=perm.map((oi,p)=>`<button class="opt ${S.ans[qi]===oi?"sel":""}" data-o="${oi}" ${S.locked?"disabled":""}><b>${LETTERS[p]}</b><span>${esc(q.o[oi])}</span></button>`).join("");
 view(`<div class="screen">
 <div class="top"><div><small>SMA NEGERI 1 PENENGAHAN · SEJARAH TINGKAT LANJUT XII</small><b>${esc(S.nama)} · ${esc(S.kelas)}</b></div>
 <div class="chips"><span class="chip no" id="ct">⏱ ${fmt(sisa())}</span><span class="chip ok" id="ca">Terjawab: ${c.a}</span><span class="chip no" id="cb">Belum: ${c.b}</span><span class="chip ${S.viol>=MAXV?"v3":"v"}" id="cv">Pelanggaran: ${S.viol}/${MAXV}</span></div></div>
 <div class="wrap"><div class="layout">
 <div class="card qcard"><div class="qno"><span>Soal ${S.cur+1} dari ${TOTAL}</span><button class="btn warn ${S.flag[qi]?"on":""}" id="rg">${ic.flag} RAGU-RAGU</button></div>
 <div class="qtext">${esc(q.q)}</div><div id="opts">${opts}</div>
 <div class="actions"><div><button class="btn ghost" id="pv" ${S.cur===0?"disabled":""}>${ic.prev} SOAL SEBELUMNYA</button><button class="btn navy" id="nx" ${S.cur===TOTAL-1?"disabled":""}>SOAL SELANJUTNYA ${ic.next}</button></div>
 <div><button class="btn ghost" id="ls">${ic.list} DAFTAR SOAL</button><button class="btn primary ${c.b===0?"pulse":""}" id="sd">${ic.send} ${c.b===0?"KIRIM JAWABAN":"SELESAI UJIAN"}</button></div></div></div>
 <aside class="card side"><div class="stats"><div class="stat g"><b id="sa">${c.a}</b><span>Sudah dijawab</span></div><div class="stat"><b id="sb">${c.b}</b><span>Belum dijawab</span></div></div>
 <div class="grid" id="gd">${navGrid()}</div>
 <div class="legend"><span><i style="background:var(--gray)"></i>Belum</span><span><i style="background:var(--green)"></i>Dijawab</span><span><i style="background:var(--blue)"></i>Dibuka</span><span><i style="background:var(--amber);border-radius:50%"></i>Ragu-ragu (${c.d})</span></div></aside>
 </div></div></div>`);
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(S.locked)return;S.ans[qi]=+b.dataset.o;save();renderExam()});
 $("#rg").onclick=()=>{if(S.locked)return;S.flag[qi]=!S.flag[qi];if(!S.flag[qi])delete S.flag[qi];save();renderExam()};
 $("#pv").onclick=()=>go(S.cur-1);$("#nx").onclick=()=>go(S.cur+1);
 $("#ls").onclick=showList;$("#sd").onclick=confirmSend;
 document.querySelectorAll(".n").forEach(b=>b.onclick=()=>go(+b.dataset.i));
}
function navGrid(){return S.order.map((q,i)=>`<button class="n ${S.ans[q]!==undefined?"a":""} ${S.flag[q]?"d":""} ${i===S.cur?"c":""}" data-i="${i}">${i+1}</button>`).join("")}
function go(i){if(S.locked||i<0||i>=TOTAL)return;S.cur=i;save();renderExam()}
function showList(){
 const rows=S.order.map((q,i)=>{const a=S.ans[q]!==undefined,d=S.flag[q];return `<button class="li" data-i="${i}"><b>${i+1}.</b><span>${esc(QB[q].q.slice(0,64))}…</span><em style="color:${d?"#b45309":a?"var(--green)":"var(--mut)"}">${d?"RAGU":a?"TERJAWAB":"KOSONG"}</em></button>`}).join("");
 const m=modal(`<h2>Daftar Soal</h2><p style="margin:0;color:var(--mut);font-size:.85rem">Ketuk soal untuk membukanya.</p><div class="list">${rows}</div><div class="row"><button class="btn ghost" id="cl">Tutup</button></div>`);
 m.querySelectorAll(".li").forEach(b=>b.onclick=()=>{closeModal();go(+b.dataset.i)});$("#cl").onclick=closeModal;
}
function confirmSend(){
 if(S.locked)return;const c=counts();
 modal(`<h2>Kirim Jawaban</h2><p style="font-size:1.05rem"><b>Apakah Anda yakin ingin mengirim seluruh jawaban?</b></p>
 <table class="tbl"><tr><td>Soal terjawab</td><td style="color:var(--green)">${c.a}</td></tr><tr><td>Soal belum terjawab</td><td style="color:${c.b?"var(--red)":"inherit"}">${c.b}</td></tr><tr><td>Soal ditandai ragu-ragu</td><td>${c.d}</td></tr></table>
 ${c.b?`<div class="alert">Masih ada ${c.b} soal yang belum dijawab. Soal kosong dihitung salah.</div>`:""}
 ${c.d?`<div class="alert">Ada ${c.d} soal yang masih ditandai ragu-ragu.</div>`:""}
 <p class="note" style="text-align:left">Setelah dikirim, jawaban tidak dapat diubah kembali.</p>
 <div class="row"><button class="btn ghost" id="bk">Periksa Lagi</button><button class="btn primary" id="ok">${ic.send} YA, KIRIM</button></div>`);
 $("#bk").onclick=closeModal;$("#ok").onclick=submitAll;
}
function score(){let b=0;for(let q=0;q<TOTAL;q++){if(S.ans[q]!==undefined&&LETTERS[S.ans[q]]===KEY[q])b++}
 const nilai=Math.round(b/TOTAL*10000)/100;return{benar:b,salah:TOTAL-b,kosong:TOTAL-Object.keys(S.ans).length,nilai,tuntas:nilai>KKM}}
function submitAll(){
 closeModal();monitoring=false;
 const r=score();r.id=S.id;r.nama=S.nama;r.kelas=S.kelas;r.pelanggaran=S.viol;r.waktu=new Date().toISOString();
 S.result=r;S.phase="terkirim";save();
 try{if(isFull())(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}
 showSubmitted();
}
function showSubmitted(){
 view(`<div class="center screen"><div class="card res"><div style="color:var(--green)" class="badge t" style="border:0">${ic.check}JAWABAN TERKIRIM</div>
 <p>Jawaban Anda sudah dikunci dan diproses oleh sistem penilaian otomatis.</p>
 <button class="btn primary full" id="lh">${ic.star} LIHAT HASIL UJIAN</button></div></div>`);
 $("#lh").onclick=()=>{S.phase="hasil";save();showResult()};
}
function showResult(){
 const r=S.result,t=r.tuntas;
 view(`<div class="center screen"><div class="card res"><h1>HASIL UJIAN</h1><p class="sub">UJIAN SEMESTER GANJIL 2026/2027</p>
 <div class="badge ${t?"t":"b"}">${t?ic.star:ic.eval}<div class="score">${r.nilai}</div>${t?"TUNTAS":"BELUM TUNTAS"}</div>
 <table class="tbl"><tr><td>Nama</td><td>${esc(r.nama)}</td></tr><tr><td>Kelas</td><td>${esc(r.kelas)}</td></tr><tr><td>Mata pelajaran</td><td>Sejarah Tingkat Lanjut</td></tr><tr><td>Jawaban benar</td><td>${r.benar}</td></tr><tr><td>Jawaban salah</td><td>${r.salah}</td></tr><tr><td>Nilai akhir</td><td>${r.nilai}</td></tr><tr><td>Status</td><td>${t?"TUNTAS":"BELUM TUNTAS"}</td></tr></table>
 <p class="note">Nilai = (jawaban benar ÷ ${TOTAL}) × 100. Tuntas bila nilai lebih dari ${KKM}.</p>
 <button class="btn primary full" id="kn" style="margin-top:8px">${ic.send} KIRIM NILAI</button><div class="err" id="er"></div></div></div>`);
 $("#kn").onclick=sendScore;
}
async function sendScore(){
 const b=$("#kn");b.disabled=true;b.textContent="Mengirim…";
 const r=S.result,all=store.get("cbt_hasil")||[];
 if(!all.find(x=>x.id===r.id)){all.push(r);store.set("cbt_hasil",all)}
 let remote=false;
 try{if(db){await Promise.race([db.collection("hasil").doc(r.id).set(r),new Promise((_,j)=>setTimeout(()=>j(new Error("t")),5000))]);remote=true}}catch(e){}
 S.sent=true;S.remote=remote;S.phase="selesai";save();toast("Nilai ujian berhasil dikirim");showDone();
}
function showDone(){
 const r=S.result||{};
 view(`<div class="center screen"><div class="card res"><div class="badge t">${ic.check}Nilai ujian berhasil dikirim</div>
 <h1>TERIMA KASIH</h1><p style="margin:10px 0 2px;font-size:1.15rem"><b>${esc(S.nama)}</b></p><p style="margin:0;color:var(--mut)">Kelas ${esc(S.kelas)}</p>
 <p>Terima kasih telah mengikuti Ujian Semester Ganjil Sejarah Tingkat Lanjut. Ujian ini tidak dapat dikerjakan ulang. Kunci jawaban baru dibahas setelah seluruh peserta selesai.</p>
 ${S.remote===false?`<div class="alert">Nilai tersimpan di perangkat ini. Tunjukkan layar hasil kepada pengawas bila diminta.</div>`:""}
 <p class="note">SMA Negeri 1 Penengahan · Tahun Pelajaran 2026/2027</p></div></div>`);
}

/* ---------- PENGAMAN ---------- */
function violation(why){
 if(!monitoring||!S||S.phase!=="ujian"||S.locked)return;
 const now=Date.now();if(now-lastV<1500)return;lastV=now;
 S.viol++;if(S.viol>=MAXV)S.locked=true;save();
 const cv=$("#cv");if(cv){cv.textContent=`Pelanggaran: ${S.viol}/${MAXV}`;cv.className="chip "+(S.viol>=MAXV?"v3":"v")}
 if(S.locked){showLock();renderExam();showLock();return}
 modal(`<h2 style="color:var(--red)">⚠ Peringatan ${S.viol} dari ${MAXV}</h2><p><b>${why}</b> telah dicatat sebagai pelanggaran.</p><div class="alert">Jika pelanggaran mencapai ${MAXV} kali, ujian otomatis dikunci. Sisa peringatan: ${MAXV-S.viol}.</div><div class="row"><button class="btn primary" id="un">SAYA MENGERTI, LANJUTKAN</button></div>`);
 $("#un").onclick=()=>{closeModal();goFull()};
}
function showLock(){
 modal(`<h2 style="color:var(--red)">Ujian Dikunci</h2><div class="alert lock">Anda telah melakukan ${MAXV} kali pelanggaran. Ujian dikunci. Silakan hubungi pengawas.</div><p style="font-size:.85rem;color:var(--mut)">Jawaban yang sudah diisi tetap tersimpan. Hanya pengawas atau guru yang dapat membuka kunci dengan PIN.</p>
 <label for="up">PIN pengawas</label><input id="up" type="password" autocomplete="off"><div class="err" id="ue"></div><div class="row"><button class="btn navy" id="ub">BUKA KUNCI</button></div>`);
 $("#ub").onclick=()=>{if($("#up").value===TEACHER_PIN){S.locked=false;S.viol=MAXV-1;save();closeModal();renderExam();goFull()}else $("#ue").textContent="PIN salah."};
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)violation("Berpindah tab atau meminimalkan browser")});
window.addEventListener("blur",()=>setTimeout(()=>{if(!document.hasFocus())violation("Meninggalkan jendela ujian")},300));
["fullscreenchange","webkitfullscreenchange"].forEach(ev=>document.addEventListener(ev,()=>{
 if(monitoring&&S&&S.phase==="ujian"&&!S.locked&&!isFull()&&canFull()){
  violation("Keluar dari mode layar penuh");
 }}));
window.addEventListener("beforeunload",e=>{if(S&&S.phase==="ujian"){e.preventDefault();e.returnValue=""}});
["contextmenu","copy","cut","paste","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{if(S&&S.phase==="ujian"&&!(e.target&&e.target.tagName==="INPUT"))e.preventDefault()}));

/* ---------- DASHBOARD GURU ---------- */
function askPin(){
 modal(`<h2>Masuk Guru</h2><label for="gp">PIN guru</label><input id="gp" type="password" autocomplete="off"><div class="err" id="ge"></div><div class="row"><button class="btn ghost" id="gc">Batal</button><button class="btn navy" id="gb">MASUK</button></div>`);
 const f=()=>{if($("#gp").value===TEACHER_PIN){closeModal();dashboard()}else $("#ge").textContent="PIN salah."};
 $("#gb").onclick=f;$("#gc").onclick=closeModal;$("#gp").addEventListener("keydown",e=>{if(e.key==="Enter")f()});
}
async function loadAll(){
 const m=new Map();(store.get("cbt_hasil")||[]).forEach(r=>m.set(r.id,r));let remote=false;
 try{if(db){const s=await Promise.race([db.collection("hasil").get(),new Promise((_,j)=>setTimeout(()=>j(new Error("t")),5000))]);s.docs.forEach(d=>m.set(d.id,d.data()));remote=true}}catch(e){}
 return{rows:[...m.values()],remote};
}
async function dashboard(){
 view(`<div class="wrap dash screen"><p>Memuat data…</p></div>`);
 await loadConfig();const {rows,remote}=await loadAll();
 let filter="";
 const draw=()=>{
  const list=rows.filter(r=>!filter||r.kelas===filter).sort((a,b)=>a.kelas.localeCompare(b.kelas)||a.nama.localeCompare(b.nama));
  const tun=list.filter(r=>r.tuntas).length,avg=list.length?Math.round(list.reduce((s,r)=>s+r.nilai,0)/list.length*100)/100:0;
  const rekap=KELAS.map(k=>{const x=rows.filter(r=>r.kelas===k),t=x.filter(r=>r.tuntas).length;return `<tr><td>${k}</td><td>${x.length}</td><td>${t}</td><td>${x.length-t}</td><td>${x.length?Math.round(x.reduce((s,r)=>s+r.nilai,0)/x.length*100)/100:"–"}</td></tr>`}).join("");
  view(`<div class="wrap dash screen"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><h1 style="text-align:left">Dashboard Guru</h1><p class="sub" style="text-align:left">Sejarah Tingkat Lanjut XII · SMA Negeri 1 Penengahan · 2026/2027</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="fk" style="width:auto"><option value="">Semua kelas</option>${KELAS.map(k=>`<option ${k===filter?"selected":""}>${k}</option>`).join("")}</select><button class="btn ghost" id="rf">Muat ulang</button><button class="btn primary" id="ex">Ekspor CSV</button><button class="btn navy" id="kb">Keluar</button></div></div>
  <div class="kpis"><div class="kpi"><b>${list.length}</b><span>Peserta sudah ujian</span></div><div class="kpi"><b style="color:var(--green)">${tun}</b><span>Tuntas</span></div><div class="kpi"><b style="color:#c2410c">${list.length-tun}</b><span>Belum tuntas</span></div><div class="kpi"><b>${avg}</b><span>Rata-rata nilai</span></div></div>
  ${remote?"":`<div class="alert">Hanya menampilkan data yang tersimpan di perangkat ini. Database bersama tidak tersedia pada sesi ini.</div>`}
  <h3>Panel pengawas: token dan waktu</h3><div class="card" style="padding:16px;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end"><div><label for="tkn" style="margin-top:0">Token masuk hari ini</label><input id="tkn" value="${esc((RAW&&RAW.token)||CFG.token)}" style="text-transform:uppercase;font-weight:800;letter-spacing:3px"></div><div><label for="dur" style="margin-top:0">Durasi ujian (menit)</label><input id="dur" type="number" min="10" max="240" value="${(RAW&&RAW.durasi)||CFG.durasi}"></div><div style="display:flex;gap:8px"><button class="btn ghost" id="acak">Acak</button><button class="btn primary" id="sv">Simpan</button></div></div><p class="note" style="text-align:left">${RAW&&RAW.tanggal?"Token ditetapkan untuk tanggal "+RAW.tanggal+(RAW.tanggal===todayStr()?" (berlaku hari ini).":" (SUDAH KEDALUWARSA, buat token baru)."):"Saat ini memakai token cadangan bawaan. Simpan token baru untuk hari ini."} Durasi baru berlaku untuk siswa yang mulai setelahnya.</p>
  <h3>Rekapitulasi per kelas</h3><div class="tw"><table><tr><th>Kelas</th><th>Peserta</th><th>Tuntas</th><th>Belum</th><th>Rata-rata</th></tr>${rekap}</table></div>
  <h3>Daftar peserta</h3><div class="tw"><table><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Benar</th><th>Nilai</th><th>Status</th><th>Pelanggaran</th></tr>${list.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${r.benar}</td><td><b>${r.nilai}</b></td><td><span class="pill ${r.tuntas?"t":"b"}">${r.tuntas?"TUNTAS":"BELUM TUNTAS"}</span></td><td>${r.pelanggaran||0}</td></tr>`).join("")||`<tr><td colspan="7" style="text-align:center;color:var(--mut)">Belum ada data.</td></tr>`}</table></div></div>`);
  $("#fk").onchange=e=>{filter=e.target.value;draw()};$("#kb").onclick=showLogin;$("#rf").onclick=dashboard;
  $("#acak").onclick=()=>{const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";let t="";for(let i=0;i<6;i++)t+=A[Math.floor(Math.random()*A.length)];$("#tkn").value=t};
  $("#sv").onclick=async()=>{const t=$("#tkn").value.trim().toUpperCase().replace(/\s/g,""),d=Math.min(240,Math.max(10,parseInt($("#dur").value)||DURASI_DEFAULT));
   if(t.length<4){toast("Token minimal 4 karakter");return}
   const c={token:t,durasi:d,tanggal:todayStr()};store.set("cbt_cfg",c);RAW=c;CFG={token:t,durasi:d};
   let ok=false;try{if(db){await Promise.race([db.collection("pengaturan").doc("ujian").set(c),new Promise((_,j)=>setTimeout(()=>j(0),5000))]);ok=true}}catch(e){}
   toast(ok?"Token dan durasi tersimpan untuk semua perangkat":"Tersimpan di perangkat ini saja (database bersama tidak tersedia)");draw()};
  $("#ex").onclick=async()=>{
   const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
   const csv="\ufeffNo,Nama,Kelas,Benar,Salah,Nilai,Status,Pelanggaran,Waktu\n"+list.map((r,i)=>[i+1,q(r.nama),r.kelas,r.benar,r.salah,r.nilai,r.tuntas?"TUNTAS":"BELUM TUNTAS",r.pelanggaran||0,r.waktu||""].join(",")).join("\n");
   try{const d=await claude.use("downloads");if(!d)throw 0;await d.save({filename:"nilai-sejarah-xii.csv",data:csv});toast("File CSV disimpan")}catch(e){
    const m=modal(`<h2>Salin data CSV</h2><p style="font-size:.85rem;color:var(--mut)">Unduhan langsung tidak tersedia. Salin teks ini lalu tempel ke Excel atau Google Sheets.</p><textarea id="ta" style="width:100%;height:220px;font:12px monospace;border-radius:10px;border:1px solid var(--line);padding:8px"></textarea><div class="row"><button class="btn navy" id="mc">Tutup</button></div>`);$("#ta").value=csv;$("#mc").onclick=closeModal}
  };
 };
 draw();
}

/* ---------- TOKEN & TIMER ---------- */
async function loadConfig(){
 let c=null;
 try{if(db){const d=await Promise.race([db.collection("pengaturan").doc("ujian").get(),new Promise((_,j)=>setTimeout(()=>j(0),3000))]);if(d&&d.exists)c=d.data()}}catch(e){}
 if(!c)c=store.get("cbt_cfg");
 if(c&&c.token){RAW=c;CFG=(c.tanggal&&c.tanggal!==todayStr())?{token:"\u0000kedaluwarsa",durasi:c.durasi||DURASI_DEFAULT}:{token:c.token,durasi:c.durasi||DURASI_DEFAULT}}
 return CFG;
}
function sisa(){if(!S||!S.mulai)return CFG.durasi*60000;return Math.max(0,S.mulai+(S.durasi||CFG.durasi)*60000-Date.now())}
function fmt(ms){const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(){clearInterval(tmr);if(!S.mulai){S.mulai=Date.now();S.durasi=CFG.durasi;save()}tmr=setInterval(tick,1000);tick()}
function tick(){
 if(!S||S.phase!=="ujian"){clearInterval(tmr);return}
 const r=sisa(),e=$("#ct");
 if(e){e.textContent="⏱ "+fmt(r);e.className="chip "+(r<300000?"v3":"no")}
 if(r<=0){clearInterval(tmr);closeModal();toast("Waktu habis. Jawaban dikirim otomatis.");submitAll()}
}

/* ---------- INIT ---------- */
showLogin();
(async()=>{try{if(window.claude&&claude.use){db=await claude.use("db")}}catch(e){db=null}})();
</script>
</body>
</html>
